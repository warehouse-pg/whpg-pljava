if [ -z "$JAVA_HOME" ]; then
    echo "Warning: 'JAVA_HOME' is not set. pljava won't work without it." 1>&2
else
    # jdk 8 keeps libjvm.so under jre/lib/<arch>/server. The <arch> component is
    # spelled "amd64" on x86_64 and matches `uname -m` on the others, so derive
    # it instead of hardcoding amd64 (which left aarch64 builds unable to
    # dlopen the JVM).
    case "$(uname -m)" in
        x86_64) _pljava_jvm_arch=amd64 ;;
        *)      _pljava_jvm_arch=$(uname -m) ;;
    esac
    LD_LIBRARY_PATH=$JAVA_HOME/jre/lib/$_pljava_jvm_arch/server:$LD_LIBRARY_PATH
    unset _pljava_jvm_arch
    # jdk 11+ flattened it to lib/server
    LD_LIBRARY_PATH=$JAVA_HOME/lib/server:$LD_LIBRARY_PATH
    export LD_LIBRARY_PATH
    export PATH=$JAVA_HOME/bin:$PATH
fi

